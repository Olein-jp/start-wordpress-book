    waitFor: ".edit-site-layout"
    actions:
      - type: click
        selector: ".editor-header__settings button[aria-label='スタイル']"
      - type: waitFor
        selector: ".editor-global-styles-sidebar"
      - type: click
        selector: ".editor-global-styles-sidebar button[aria-label='スタイルブック']"
      - type: waitFor
        selector: ".editor-style-book__iframe"
      - type: delay
        ms: 500

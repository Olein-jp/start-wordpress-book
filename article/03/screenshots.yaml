defaults:
  viewport:
    width: 1920
    height: 1440
  delay: 500

shots:
  - id: 3-1-site-editor
    title: サイトエディター 最初の画面
    url: /wp-admin/site-editor.php
    output: images/7.0/3-1-site-editor.jpg
    authState: true
    waitFor: ".edit-site-layout"
    wpTheme:
      slug: twentytwentyfive
  - id: 3-1-site-editor-access-menu
    title: サイトエディター アクセスメニュー
    url: /wp-admin/index.php
    output: images/7.0/3-1-site-editor-access-menu.jpg
    authState: true
    waitFor: "#adminmenu"
    actions:
      - type: hover
        selector: "#menu-appearance > a.menu-top"
      - type: waitFor
        selector: ".menu-icon-appearance .wp-submenu a[href='site-editor.php']"
      - type: hover
        selector: ".menu-icon-appearance .wp-submenu a[href='site-editor.php']"
  - id: 3-1-site-editor-side-menu
    title: サイトエディター サイドメニュー
    url: /wp-admin/site-editor.php
    output: images/7.0/3-1-site-editor-side-menu.jpg
    authState: true
    waitFor: ".edit-site-layout"
  - id: 3-1-site-editor-command-palette-trigger
    title: サイトエディター コマンドパレットのトリガー
    url: /wp-admin/site-editor.php
    output: images/7.0/3-1-site-editor-command-palette-trigger.jpg
    authState: true
    waitFor: ".edit-site-layout"
    actions:
      - type: click
        selector: ".edit-site-site-hub_toggle-command-center"
      - type: waitFor
        selector: ".components-modal__screen-overlay.commands-command-menu__overlay"
      - type: keyboard
        text: "スタイル"
      - type: waitFor
        selector: "[cmdk-item][data-value='移動: スタイル']"
  - id: 3-1-site-editor-style-book
    title: サイトエディター スタイルブック
    url: /wp-admin/site-editor.php?p=%2Fstyles
    output: images/7.0/3-1-site-editor-style-book.jpg
    authState: true
    waitFor: ".edit-site-layout"
    actions:
      - type: click
        selector: "button[aria-label='スタイルブック']"
      - type: waitFor
        selector: ".editor-style-book__iframe"
      - type: delay
        ms: 500
  - id: 3-1-site-editor-right-sidebar-styles
    title: サイトエディター 右サイドバー スタイル
    url: /wp-admin/site-editor.php?p=%2F&canvas=edit
    output: images/7.0/3-1-site-editor-right-sidebar-styles.jpg
    authState: true
    waitFor: ".edit-site-layout"
    actions:
      - type: click
        selector: ".editor-header__settings button[aria-label='スタイル']"
      - type: waitFor
        selector: ".editor-global-styles-sidebar"
      - type: delay
        ms: 500
  - id: 3-1-site-editor-revisions
    title: サイトエディター リビジョン
    url: /wp-admin/site-editor.php?p=%2F&canvas=edit
    output: images/7.0/3-1-site-editor-revisions.jpg
    authState: true
    waitFor: ".edit-site-layout"
    actions:
      - type: click
        selector: ".editor-header__settings button[aria-label='スタイル']"
      - type: waitFor
        selector: ".editor-global-styles-sidebar"
      - type: click
        selector: ".editor-global-styles-sidebar button[aria-label='リビジョン']"
      - type: waitFor
        selector: "text=リビジョン"
      - type: delay
        ms: 500
    screenshot:
      zoom: 1.5
      clip:
        x: 640
        y: 0
        width: 1280
        height: 960
  - id: 3-1-site-editor-style-book-from-right-sidebar
    title: サイトエディター 右サイドバーからスタイルブック
    memo: 罫線で指示出す
    url: /wp-admin/site-editor.php?p=%2F&canvas=edit

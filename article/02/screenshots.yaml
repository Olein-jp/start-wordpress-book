defaults:
  viewport:
    width: 1920
    height: 1440
  delay: 500

shots:
  - id: 2-1-wordpress-dashboard-lined
    title: WordPress ダッシュボード
    memo: 3つのエリアを示す補足作図を追加する
    url: /wp-admin/
    output: images/7.0/2-1-wordpress-dashboard-lined.jpg
    authState: true
    waitFor: "#wpbody-content"

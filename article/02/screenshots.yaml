    authState: true
    waitFor: "#wpbody-content"
  - id: 2-4-wordpress-update-core
    title: WordPress ダッシュボード 更新
    url: /wp-admin/update-core.php?force-check=1
    output: images/7.0/2-4-wordpress-update-core.jpg
    authState: true
    waitFor: "#wpbody-content"
    delay: 1000
    wpPlugins:
      - slug: wp-multibyte-patch
        version: "2.9.2"
      - slug: contact-form-7
        version: "6.1.5"
    wpTheme:
      slug: twentytwentyone
      version: "2.7"
    afterSnap:
      wpUpdates:
        plugins: true
        themes: true
      wpTheme: twentytwentyfive
  - id: 2-4-wordpress-update-core-minor-update-setting
    title: WordPress コアの自動更新設定（マイナーアップデート有効）
    url: /wp-admin/update-core.php
    output: images/7.0/2-4-wordpress-update-core-minor-update-setting.jpg
    authState: true
    waitFor: "#wpbody-content"
    wpOptions:
      auto_update_core_major: disabled
    screenshot:
      zoom: 2
      deviceScaleFactor: 2
      outputScale: 2
      clip:
        x: 0
        y: 0
        width: 960
        height: 720
  - id: 2-4-wordpress-update-core-major-update-setting

        selector: "#dashboard_primary"
  - id: 2-3-wordpress-dashboard-admin-bar-lined
    title: WordPress ダッシュボード アドミンバー
    memo: アドミンバーに罫線を入れる
    url: /wp-admin/
    output: images/7.0/2-3-wordpress-dashboard-admin-bar-lined.jpg
    authState: true
    waitFor: "#wpbody-content"
  - id: 2-3-wp-admin-bar-about
    title: アドミンバー WordPressについて
    url: /wp-admin/about.php
    output: images/7.0/2-3-wp-admin-bar-about.jpg
    authState: true
    waitFor: "#wpbody-content"
  - id: 2-3-wp-admin-bar-credit
    title: アドミンバー クレジット（貢献者）
    url: /wp-admin/credits.php
    output: images/7.0/2-3-wp-admin-bar-credit.jpg
    authState: true
    waitFor: "#wpbody-content"
  - id: 2-3-wp-admin-bar-freedoms
    title: アドミンバー 自由について
    url: /wp-admin/freedoms.php
    output: images/7.0/2-3-wp-admin-bar-freedoms.jpg
    authState: true
    waitFor: "#wpbody-content"
  - id: 2-3-wp-admin-bar-privacy
    title: アドミンバー プライバシー
    url: /wp-admin/privacy.php
    output: images/7.0/2-3-wp-admin-bar-privacy.jpg
    authState: true
    waitFor: "#wpbody-content"
  - id: 2-3-wp-admin-bar-contribute
    title: アドミンバー 参加する
    url: /wp-admin/contribute.php
    output: images/7.0/2-3-wp-admin-bar-contribute.jpg
    authState: true
    waitFor: "#wpbody-content"
  - id: 2-3-wp-admin-bar-site-name-hover
    memo: サイト名と「サイトを表示」を罫線で囲む
    title: アドミンバー サイト名ホバー
    url: /wp-admin/
    output: images/7.0/2-3-wp-admin-bar-site-name-hover.jpg
    authState: true
    waitFor: "#wp-admin-bar-site-name"
    screenshot:
      zoom: 2.5
      deviceScaleFactor: 2
      outputScale: 2
      focus:
        selector: "#wp-admin-bar-site-name"
    actions:
    - type: hover
      selector: "#wp-admin-bar-site-name"
    - type: delay
      ms: 300
  - id: 2-3-wp-admin-bar-command-palette
    title: アドミンバー コマンドパレット
    url: /wp-admin/

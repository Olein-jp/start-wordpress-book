defaults:
  viewport:
    width: 1920
    height: 1440
  delay: 500

shots:
  - id: 2-1-wordpress-dashboard-lined
    title: WordPress ダッシュボード
    memo: 3つのエリアを示す補足作図を追加する
    url: /wp-admin/
    output: images/7.0/2-1-wordpress-dashboard-lined.jpg
    authState: true
    waitFor: "#wpbody-content"
  - id: 2-2-wordpress-dashboard-normal
    title: WordPress ダッシュボード
    url: /wp-admin/
    output: images/7.0/2-2-wordpress-dashboard-normal.jpg
    authState: true
    waitFor: "#wpbody-content"
  - id: 2-2-wordpress-dashboard-site-health
    title: WordPress ダッシュボード サイトヘルスステータス拡大
    memo: サイトヘルスステータスの拡大部分を罫線で囲う
    url: /wp-admin/
    output: images/7.0/2-2-wordpress-dashboard-site-health.jpg
    authState: true
    waitFor: "#dashboard_site_health"
    screenshot:
      zoom: 2
      deviceScaleFactor: 2
      outputScale: 2
      focus:
        selector: "#dashboard_site_health"
  - id: 2-2-wordpress-dashboard-right-now
    title: WordPress ダッシュボード 概要
    memo: 概要の拡大部分を罫線で囲う
    url: /wp-admin/
    output: images/7.0/2-2-wordpress-dashboard-right-now.jpg
    authState: true
    waitFor: "#dashboard_right_now"
    screenshot:
      zoom: 2
      deviceScaleFactor: 2
      outputScale: 2
      focus:
        selector: "#dashboard_right_now"
  - id: 2-2-wordpress-dashboard-activity
    title: WordPress ダッシュボード アクティビティ拡大
    memo: アクティビティの拡大部分を罫線で囲う
    url: /wp-admin/
    output: images/7.0/2-2-wordpress-dashboard-activity.jpg
    authState: true
    waitFor: "#dashboard_activity"
    screenshot:
      zoom: 2
      deviceScaleFactor: 2
      outputScale: 2
      focus:
        selector: "#dashboard_activity"
  - id: 2-2-wordpress-dashboard-quick-draft
    title: WordPress ダッシュボード クイックドラフト拡大
    memo: クイックドラフトの拡大部分を罫線で囲う
    url: /wp-admin/
    output: images/7.0/2-2-wordpress-dashboard-quick-draft.jpg
    authState: true
    waitFor: "#dashboard_quick_press"
    screenshot:
      zoom: 2
      deviceScaleFactor: 2
      outputScale: 2
      focus:
        selector: "#dashboard_quick_press"
  - id: 2-2-wordpress-dashboard-wordpress-event
    title: WordPress ダッシュボード WordPressイベント
    memo: WordPressイベントの拡大部分を罫線で囲う
    url: /wp-admin/
    output: images/7.0/2-2-wordpress-dashboard-wordpress-event.jpg
    authState: true
    waitFor: "#dashboard_primary"
    screenshot:
      zoom: 2
      deviceScaleFactor: 2
      outputScale: 2

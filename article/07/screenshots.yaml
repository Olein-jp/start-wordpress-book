    waitFor: "#wpbody-content"
  - id: 7-1-admin-dashboard-70
    title: WordPress 7.0 の管理画面ダッシュボード
    url: /wp-admin
    output: images/7.0/7-1-admin-dashboard-70.jpg
    authState: true
    waitFor: "#wpbody-content"
